name: HubSpot Daily Sync

on:
  schedule:
    - cron: '0 13 * * *'   # 7am Ciudad de México (UTC-6 invierno / 8am verano)
  workflow_dispatch:         # disparo manual desde GitHub si se necesita

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"  >> .env.local
          echo "HUBSPOT_ACCESS_TOKEN=${{ secrets.HUBSPOT_ACCESS_TOKEN }}"            >> .env.local

      - name: Delta sync HubSpot → Supabase
        run: npx tsx scripts/hubspot-sync.ts --delta

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Refresh analytics cache
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db query \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            "SELECT refresh_hubspot_analytics();"
